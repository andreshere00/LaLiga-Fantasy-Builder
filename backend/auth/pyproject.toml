[project]
name = "laliga-fantasy-builder-auth"
version = "0.1.0"
description = "Auth service for LaLiga Fantasy Builder (app identity + LaLiga Fantasy delegation)"
readme = "README.md"
authors = [
    { name = "Andrés Herencia" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-instrumentation-asyncpg>=0.51b0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-redis>=0.51b0",
    "opentelemetry-sdk>=1.30.0",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.10.0",
    "redis>=5.2.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]
browser = [
    "playwright>=1.49.0",
]

[project.scripts]
laliga-fantasy-builder-auth = "fantasy_auth.main:run"
laliga-auth-helper = "fantasy_auth.cli.helper:main"
pair-laliga = "fantasy_auth.cli.pair:main"
authenticate-laliga = "fantasy_auth.cli.authenticate:main"
fantasy-browser-session = "fantasy_auth.cli.browser_session:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "fantasy_auth"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
]
