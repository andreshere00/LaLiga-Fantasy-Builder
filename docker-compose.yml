# Values come from the repo-root `.env` (copy `.env.template`).
# Container paths below are image contracts; host paths and service URLs are env.

services:
  keycloak:
    image: ${KEYCLOAK_IMAGE}
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: ${KEYCLOAK_HTTP_PORT}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_PORT: ${KEYCLOAK_HOSTNAME_PORT}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "${KEYCLOAK_PUBLISH_PORT}:${KEYCLOAK_HTTP_PORT}"
    volumes:
      - ${KEYCLOAK_REALM_IMPORT_PATH}:/opt/keycloak/data/import/realm-fantasy-builder.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/${KEYCLOAK_HTTP_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [public, internal]

  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PUBLISH_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: [full]
    networks: [internal]

  redis:
    image: ${REDIS_IMAGE}
    ports:
      - "${REDIS_PUBLISH_PORT}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: [full]
    networks: [internal]

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ${OTEL_COLLECTOR_CONFIG_PATH}:/etc/otel-collector-config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_HTTP_PORT}:${OTEL_COLLECTOR_HTTP_PORT}"
    profiles: [full, otel]
    networks: [internal]

  auth:
    build:
      context: ./backend/auth
      dockerfile: Dockerfile
    ports:
      - "${AUTH_PUBLISH_PORT}:${AUTH_SERVICE_PORT}"
    env_file: [./backend/auth/.env]
    environment:
      APP_OIDC_TOKEN_URL: ${APP_OIDC_TOKEN_URL}
      APP_OIDC_JWKS_URL: ${APP_OIDC_JWKS_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MIGRATION_AUTO_APPLY: ${MIGRATION_AUTO_APPLY}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    profiles: [apps, full]
    networks: [public, internal]

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    ports:
      - "${API_PUBLISH_PORT}:${API_SERVICE_PORT}"
    env_file: [./backend/api/.env]
    environment:
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      AUTH_INTERNAL_BASE_URL: ${AUTH_INTERNAL_BASE_URL}
      INTERNAL_JWT_ISSUER: ${INTERNAL_JWT_ISSUER}
      INTERNAL_JWT_AUDIENCE: ${INTERNAL_JWT_AUDIENCE}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      auth:
        condition: service_healthy
    profiles: [apps, full]
    networks: [public, internal]

networks:
  public:
  internal:
    internal: true
