<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lineup fixture panel — design preview</title>
  <link rel="stylesheet" href="../../frontend/src/styles/design-system.css">
  <link rel="stylesheet" href="../../frontend/src/styles/tokens.css">
  <style>
    @font-face { font-family: "At Aero"; src: url("../../frontend/src/assets/fonts/AtAero-Regular.otf"); font-weight: 400; }
    @font-face { font-family: "At Aero"; src: url("../../frontend/src/assets/fonts/AtAero-Medium.otf"); font-weight: 500; }
    @font-face { font-family: Anton; src: url("../../frontend/src/assets/fonts/Anton-Regular.ttf"); font-weight: 400; }
    body { margin: 0; }
    .preview-tools { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 5vw; align-items: center; }
    .preview-tools p { flex: 1 1 320px; margin: 0; }
    .preview-shell { margin: 24px 5vw; }
  </style>
  <style id="fixture-panel-styles">
    .fixture-preview { grid-column: 1 / -1; order: 0; min-width: 0; container-type: inline-size; border: 1px solid var(--fb-line); background: var(--fb-surface); color: var(--fb-secondary); }
    .fixture-preview * { box-sizing: border-box; }
    .fixture-preview-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 20px; padding: 16px 20px 12px; }
    .fixture-preview-heading { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .fixture-preview h2 { margin: 0; font: 400 21px/1.3 Anton, sans-serif; letter-spacing: .03em; text-transform: uppercase; color: var(--fb-tertiary); }
    .fixture-preview-state { padding: 3px 8px; border: 1px solid var(--fb-line); font-size: 12px; font-weight: 500; background: var(--fb-subtle); }
    .fixture-preview-state.is-active { border-color: var(--fb-primary); color: var(--fb-secondary); background: var(--fb-subtle); }
    .fixture-preview-state.is-active::before { content: ""; display: inline-block; width: 7px; height: 7px; background: var(--fb-primary); margin-right: 6px; }
    .fixture-preview-meta { margin: 5px 0 0; color: var(--fb-muted); font-size: 12px; line-height: 1.5; }
    .fixture-preview-actions { display: flex; gap: 6px; align-items: center; }
    .fixture-preview-actions button { display: inline-flex; justify-content: center; align-items: center; width: 44px; height: 44px; background: var(--fb-surface); color: var(--fb-secondary); border: 1px solid var(--fb-control-line); border-radius: 0; font: 400 22px/1 "At Aero", sans-serif; }
    .fixture-preview-actions button:disabled { opacity: .35; }
    .fixture-preview-actions button:hover:not(:disabled) { background: var(--fb-coral); color: var(--fb-on-coral); }
    .fixture-preview button:focus-visible, .fixture-preview-scroll:focus-visible { outline: 2px solid var(--fb-focus); outline-offset: -3px; }
    .fixture-preview-scroll { overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; scrollbar-color: var(--fb-cyan) var(--fb-subtle); margin: 0 12px; scroll-snap-type: x proximity; }
    .fixture-preview-list { display: flex; width: max-content; min-width: 100%; list-style: none; margin: 0; padding: 0 0 10px; }
    .fixture-preview-match { flex: 0 0 232px; width: 232px; padding: 8px 16px 10px; border-left: 1px solid var(--fb-line); scroll-snap-align: start; }
    .fixture-preview-match:first-child { border-left: 0; }
    .fixture-preview-match.is-live { background: var(--fb-subtle); box-shadow: inset 0 3px var(--fb-primary); }
    .fixture-preview-match-date { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin: 0 0 9px; color: var(--fb-muted); font-size: 12px; white-space: nowrap; }
    .fixture-preview-live-label { color: var(--fb-secondary); font-weight: 500; }
    .fixture-preview-live-label::before { content: ""; width: 6px; height: 6px; display: inline-block; margin-right: 4px; background: var(--fb-primary); }
    .fixture-preview-team { display: grid; grid-template-columns: 28px minmax(0, 1fr) 28px; gap: 9px; align-items: center; min-height: 36px; font-size: 14px; }
    .fixture-preview-crest { display: flex; width: 28px; height: 28px; align-items: center; justify-content: center; }
    .fixture-preview-crest img { width: 100%; height: 100%; object-fit: contain; }
    .fixture-preview-score { text-align: right; font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .fixture-preview-score.is-empty { color: var(--fb-muted); }
    .fixture-preview-weather { min-height: 66px; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--fb-line); font-size: 12px; color: var(--fb-secondary); }
    .fixture-preview-weather p { margin: 0; line-height: 1.5; }
    .fixture-preview-weather-summary { display: flex; align-items: center; gap: 7px; }
    .fixture-preview-weather-icon { display: inline-block; width: 20px; height: 20px; flex: 0 0 20px; background: currentColor; mask: var(--preview-weather-icon) center / contain no-repeat; }
    .fixture-preview-weather-metrics, .fixture-preview-weather-note { color: var(--fb-muted); font-size: 12px; }
    .fixture-preview-weather.is-empty { color: var(--fb-muted); }
    .fixture-preview-footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; padding: 8px 20px 12px; font-size: 12px; color: var(--fb-muted); }
    @container (min-width: 1100px) {
      .fixture-preview-match { flex-basis: calc((100cqw - 24px) / 5); width: calc((100cqw - 24px) / 5); }
    }
    @media (max-width: 600px) {
      .fixture-preview-header { padding: 14px 12px 10px; gap: 10px; }
      .fixture-preview-header > div:first-child { width: 100%; }
      .fixture-preview h2 { font-size: 19px; }
      .fixture-preview-actions { margin-left: auto; }
      .fixture-preview-match { flex-basis: 248px; width: 248px; padding-inline: 12px; }
      .fixture-preview-scroll { margin-inline: 6px; }
      .fixture-preview-footer { padding-inline: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { .fixture-preview-scroll { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <div class="preview-tools">
    <p>Design proposal · Fictional matches, dates, scores, and weather.</p>
    <button type="button" class="fb-button fb-button--outline fb-button--square" id="preview-state">Show in-progress fixture</button>
    <button type="button" class="fb-button fb-button--outline fb-button--square" id="preview-theme">Switch theme</button>
    <button type="button" class="fb-button fb-button--outline fb-button--square" id="preview-weather">Show unavailable weather</button>
  </div>
  <main class="preview-shell" id="preview-mount"></main>

        if (!active || index >= 8) {
          const weather = document.createElement("div");
          weather.className = "fixture-preview-weather";
          const forecast = active ? previewForecasts[index === 8 ? 1 : 2] : previewForecasts[index];
          if (!weatherAvailable) {
            weather.classList.add("is-empty");
            weather.innerHTML = "<p>Forecast unavailable</p><p class='fixture-preview-weather-note'>Matches and scores still update</p>";
          } else if (!forecast) {
            weather.classList.add("is-empty");
            weather.innerHTML = "<p>Forecast closer to kickoff</p><p class='fixture-preview-weather-note'>Outside the 5-day window</p>";
          } else {
            weather.innerHTML = `<p class="fixture-preview-weather-summary"><span class="fixture-preview-weather-icon" style="--preview-weather-icon: url('${previewWeatherIcons[forecast.icon]}')" aria-hidden="true"></span><span>Forecast ${forecast.temperature}°C · ${forecast.condition}</span></p><p class="fixture-preview-weather-metrics">Rain ${forecast.rain == null ? "—" : forecast.rain + "%"} · Wind ${forecast.wind} km/h</p>${live ? '<p class="fixture-preview-weather-note">Saved kickoff forecast · 20 min ago</p>' : ""}`;
          }
          item.append(weather);
        }
        list.append(item);
      });
      const viewport = panel.querySelector(".fixture-preview-scroll");
      const previous = panel.querySelector('[data-action="previous"]');
      const next = panel.querySelector('[data-action="next"]');
      const updateButtons = () => {
        previous.disabled = viewport.scrollLeft < 2;
        next.disabled = viewport.scrollLeft + viewport.clientWidth >= viewport.scrollWidth - 2;
      };
      previous.onclick = () => viewport.scrollBy({ left: -viewport.clientWidth * .8 });
      next.onclick = () => viewport.scrollBy({ left: viewport.clientWidth * .8 });
      panel.querySelector('[data-action="refresh"]').onclick = () => {};
      viewport.addEventListener("scroll", updateButtons);
      new ResizeObserver(updateButtons).observe(viewport);
      requestAnimationFrame(updateButtons);
      return panel;
    };
  </script>
  <script>
    let mode = new URLSearchParams(location.search).get("state") === "active" ? "active" : "upcoming";
    let weatherAvailable = true;
    function renderPreview() {
      document.getElementById("preview-mount").replaceChildren(window.createFixturePanelPreview(mode, weatherAvailable));
      document.getElementById("preview-state").textContent = mode === "upcoming" ? "Show in-progress fixture" : "Show upcoming fixture";
      document.getElementById("preview-weather").textContent = weatherAvailable ? "Show unavailable weather" : "Show sample forecasts";
    }
    document.getElementById("preview-state").onclick = () => {
      mode = mode === "upcoming" ? "active" : "upcoming";
      document.getElementById("preview-state").textContent = mode === "upcoming" ? "Show in-progress fixture" : "Show upcoming fixture";
      renderPreview();
    };
    document.getElementById("preview-theme").onclick = () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; };
    document.getElementById("preview-weather").onclick = () => { weatherAvailable = !weatherAvailable; renderPreview(); };
    renderPreview();
  </script>
</body>
</html>
