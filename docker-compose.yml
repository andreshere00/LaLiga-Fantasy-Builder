# Values come from the repo-root `.env` (copy `.env.template`).
# Container paths below are image contracts; host paths and service URLs are env.

services:
  postgres:
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/identity.sh:/docker-entrypoint-initdb.d/identity.sh:ro
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_dev}
      VAULT_DB_PASSWORD: ${VAULT_DB_PASSWORD:-vault_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal, local]

  redis:
    image: ${REDIS_IMAGE}
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal, local]

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ${OTEL_COLLECTOR_CONFIG_PATH:-${OTEL_COLLECTOR_CONFIG_HOST_PATH:-./docker/otel/collector-config.yaml}}:${OTEL_COLLECTOR_CONFIG_CONTAINER_PATH:-/etc/otel-collector-config.yaml}:ro
    ports:
      - "${OTEL_COLLECTOR_HTTP_PORT}:${OTEL_COLLECTOR_HTTP_PORT}"
    profiles: [full, otel]
    networks: [internal]

  identity-migrate:
    build: ./backend/identity
    env_file: [./backend/identity/.env]
    environment:
      NODE_ENV: ${IDENTITY_NODE_ENV:-development}
      IDENTITY_DATABASE_URL: postgresql://fantasy_identity:${IDENTITY_DB_PASSWORD:-identity_dev}@postgres:5432/fantasy_identity
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [apps, full]
    networks: [internal]

  identity:
    build: ./backend/identity
    env_file: [./backend/identity/.env]
    environment:
      NODE_ENV: ${IDENTITY_NODE_ENV:-development}
      IDENTITY_DATABASE_URL: postgresql://fantasy_identity:${IDENTITY_DB_PASSWORD:-identity_dev}@postgres:5432/fantasy_identity
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@fantasybuilder.es}
      INTERNAL_JWT_ISSUER: ${INTERNAL_JWT_ISSUER:-http://localhost:3000/auth}
      LALIGA_AUTH_URL: http://auth:8000
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    profiles: [apps, full]
    networks: [internal, egress]

  auth:
    build:
      context: ./backend/auth
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${AUTH_PUBLISH_PORT}:${AUTH_SERVICE_PORT}"
    env_file: [./backend/auth/.env]
    environment:
      AUTH_JWKS_URL: http://identity:8003/auth/jwks
      INTERNAL_JWT_ISSUER: ${INTERNAL_JWT_ISSUER:-http://localhost:3000/auth}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://fantasy_vault:${VAULT_DB_PASSWORD:-vault_dev}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-fantasy_auth}}
      REDIS_URL: ${REDIS_URL:-redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}}
      MIGRATION_AUTO_APPLY: ${MIGRATION_AUTO_APPLY}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    profiles: [apps, full]
    networks: [public, internal]

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${API_PUBLISH_PORT}:${API_SERVICE_PORT}"
    env_file: [./backend/api/.env]
    environment:
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://identity:8003/auth/jwks}
      AUTH_INTERNAL_BASE_URL: ${AUTH_INTERNAL_BASE_URL:-http://${AUTH_SERVICE_HOST:-auth}:${AUTH_SERVICE_PORT:-8000}}
      INTERNAL_JWT_ISSUER: ${INTERNAL_JWT_ISSUER}
      INTERNAL_JWT_AUDIENCE: ${INTERNAL_JWT_AUDIENCE}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SCRAPING_BASE_URL: ${SCRAPING_BASE_URL:-http://scraping:8002}
      SCRAPING_SERVICE_TOKEN: ${SCRAPING_SERVICE_TOKEN}
    depends_on:
      auth:
        condition: service_healthy
      scraping:
        condition: service_healthy
        required: false
    profiles: [apps, full]
    networks: [public, internal]

  scraping:
    build:
      context: ./backend/scraping
      dockerfile: Dockerfile
    env_file: [./backend/scraping/.env]
    environment:
      SCRAPING_SERVICE_TOKEN: ${SCRAPING_SERVICE_TOKEN}
      SCRAPING_SERVICE_PORT: ${SCRAPING_SERVICE_PORT:-8002}
      SCRAPING_EXPOSE_DOCS: ${SCRAPING_EXPOSE_DOCS:-false}
      USE_MEMORY_STORE: ${USE_MEMORY_STORE:-true}
      REDIS_URL: ${SCRAPING_REDIS_URL:-redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/1}
      SCRAPER_CONTACT: ${SCRAPER_CONTACT:-dev@local}
    ports:
      - "${SCRAPING_PUBLISH_PORT:-8002}:${SCRAPING_SERVICE_PORT:-8002}"
    depends_on:
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles: [apps, full]
    networks: [internal, egress]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PUBLISH_PORT:-3000}:80"
    depends_on:
      identity:
        condition: service_healthy
      auth:
        condition: service_healthy
      api:
        condition: service_healthy
    profiles: [apps, full]
    networks: [public, internal]

networks:
  local: # loopback-published development dependencies need a host-reachable bridge
  public:
  internal:
    internal: true
  egress: # outbound internet for identity providers/mail and scraping

volumes:
  postgres-data:
