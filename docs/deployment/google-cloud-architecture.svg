<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1250" viewBox="0 0 1660 1250" role="img" aria-labelledby="title description"><title id="title">Fantasy Builder: Google Cloud architecture for four concurrent users</title><desc id="description">One e2-small VM runs Caddy, Nginx, four backend services, PostgreSQL and Redis. Only HTTP and HTTPS ports are public. The host reads five Secret Manager secrets during explicit releases. Databases are backed up to a private Cloud Storage bucket. External providers are reached by outbound connections.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker></defs><rect width="1660" height="1250" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="50" y="62" font-size="37" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="50" dy="0">Fantasy Builder · Google Cloud</tspan></text>
<text x="50" y="103" font-size="23" font-weight="400" fill="#475569" text-anchor="start"><tspan x="50" dy="0">Recommended starting point for up to four simultaneous users</tspan></text>
<rect x="1270" y="38" width="340" height="68" rx="16" fill="#0f172a"/>
<text x="1440" y="68" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="1440" dy="0">≈ $16–20 / month</tspan></text>
<text x="1440" y="91" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="middle"><tspan x="1440" dy="0">after trial · low usage · before tax</tspan></text>
<rect x="50" y="160" width="250" height="100" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="72" y="195" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="72" dy="0">Browser</tspan></text>
<text x="72" y="225" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="72" dy="0">Up to 4 signed-in users</tspan></text>
<rect x="370" y="160" width="300" height="100" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="392" y="195" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="392" dy="0">Existing registrar DNS</tspan></text>
<text x="392" y="225" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="392" dy="0">fantasybuilder.es → VM IP</tspan></text>
<rect x="1080" y="160" width="530" height="100" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="1102" y="195" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="1102" dy="0">Build and administration</tspan></text>
<text x="1102" y="225" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1102" dy="0">CI: tests + builds · publish on main push only</tspan><tspan x="1102" dy="25">Keyless writer IAM · IAP + OS Login</tspan></text>
<rect x="710" y="150" width="340" height="135" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<text x="730" y="179" font-size="21" font-weight="700" fill="#0f172a">Secret Manager · 5 secrets</text>
<text x="730" y="204" font-size="15" fill="#475569"><tspan x="730">Operator uploads secret payloads</tspan><tspan x="730" dy="22">Host fetches on explicit releases</tspan><tspan x="730" dy="22">Scoped IAM · local snapshot at boot</tspan></text>
