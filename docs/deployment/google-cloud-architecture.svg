<rect x="650" y="640" width="300" height="100" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="672" y="675" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="672" dy="0">API · 8001</tspan></text>
<text x="672" y="705" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="672" dy="0">Fantasy features + builder</tspan></text>
<rect x="990" y="640" width="220" height="100" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="1012" y="675" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="1012" dy="0">Scraping · 8002</tspan></text>
<text x="1012" y="705" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1012" dy="0">One worker + cache</tspan></text>
<path d="M520 525 V580 H340 V640" fill="none" stroke="#64748b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/>
