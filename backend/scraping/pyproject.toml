[project]
name = "laliga-fantasy-builder-scraping"
version = "0.1.0"
description = "Offline FutbolFantasy parser for LaLiga Fantasy Builder"
readme = "README.md"
authors = [
    { name = "Andrés Herencia" }
]
requires-python = ">=3.14"
dependencies = [
    "cssselect>=1.2.0",
    "fastapi>=0.115.0",
    "lxml>=6.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
fantasy-parse = "fantasy_scraping.parser.cli:main"
laliga-fantasy-builder-scraping = "fantasy_scraping.main:run"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/parser"]
addopts = "--strict-markers"

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "fantasy_scraping"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "hypothesis>=6.130.0",
    "pytest>=8.3.0",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
branch = true
source = ["fantasy_scraping"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
