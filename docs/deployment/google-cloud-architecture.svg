<text x="335" y="189" font-size="14" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="335" dy="0">lookup</tspan></text>
<rect x="50" y="330" width="1210" height="780" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
<text x="78" y="370" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="78" dy="0">Compute Engine · e2-small · 2 GiB RAM · us-central1</tspan></text>
<text x="78" y="398" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="78" dy="0">Docker Compose · one instance per service · private backend connections</tspan></text>
