name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --group dev
          uv sync --directory backend/auth --group dev
          uv sync --directory backend/api --group dev

      - name: Lint
        run: uv run poe lint

      - name: Test
        run: uv run poe test
