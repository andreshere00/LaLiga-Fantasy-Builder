<text x="1100" y="778" font-size="14" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1100" dy="0">Private scrape calls + service token</tspan></text>
<rect x="190" y="900" width="370" height="120" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="212" y="935" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="212" dy="0">PostgreSQL</tspan></text>
<text x="212" y="965" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="212" dy="0">Identity DB + vault DB</tspan><tspan x="212" dy="25">Separate roles; durable volume</tspan></text>
