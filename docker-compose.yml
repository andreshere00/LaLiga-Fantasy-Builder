services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-fantasy-builder.json:/opt/keycloak/data/import/realm-fantasy-builder.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - public
      - internal

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
      POSTGRES_DB: fantasy_auth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy -d fantasy_auth"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles:
      - full
    networks:
      - internal

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles:
      - full
    networks:
      - internal

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel/collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"
    profiles:
      - full
      - otel
    networks:
      - internal

  auth:
    build:
      context: ./backend/auth
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/auth/.env
    environment:
      USE_MEMORY_STORE: "false"
      DATABASE_URL: postgresql://fantasy:fantasy@postgres:5432/fantasy_auth
      REDIS_URL: redis://redis:6379/0
      MIGRATION_AUTO_APPLY: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-service-token}
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full
    networks:
      - public
      - internal

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./backend/api/.env
    environment:
      AUTH_JWKS_URL: http://auth:8000/.well-known/jwks.json
      AUTH_INTERNAL_BASE_URL: http://auth:8000
      INTERNAL_JWT_ISSUER: https://auth.fantasy-builder.local
      INTERNAL_JWT_AUDIENCE: fantasy-api
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-service-token}
    depends_on:
      auth:
        condition: service_started
    profiles:
      - full
    networks:
      - public
      - internal

networks:
  public:
  internal:
    internal: true
