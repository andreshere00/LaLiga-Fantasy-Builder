<path d="M660 525 V580 H800 V640" fill="none" stroke="#64748b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/>
<text x="764" y="569" font-size="16" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="764" dy="0">/api/*</tspan></text>
<path d="M650 690 H490" fill="none" stroke="#64748b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/>
