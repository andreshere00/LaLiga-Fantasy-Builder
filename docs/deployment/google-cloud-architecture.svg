<text x="672" y="935" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="672" dy="0">Redis</tspan></text>
<text x="672" y="965" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="672" dy="0">Auth rate limiting</tspan><tspan x="672" dy="25">Private network only</tspan></text>
<path d="M300 740 V900" fill="none" stroke="#64748b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/>
<text x="85" y="812" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="85" dy="0">vault, pairings,</tspan></text>
<text x="85" y="835" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="85" dy="0">refresh locks</tspan></text>
<path d="M420 740 V860 H800 V900" fill="none" stroke="#64748b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/>
<text x="665" y="847" font-size="16" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="665" dy="0">rate limits</tspan></text>
<path d="M1160 475 H1230 V875 H500 V900" fill="none" stroke="#64748b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/>
<text x="1060" y="863" font-size="16" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1060" dy="0">identity DB</tspan></text>
<text x="190" y="1060" font-size="18" font-weight="400" fill="#065f46" text-anchor="start"><tspan x="190" dy="0">30 GiB pd-standard · PostgreSQL + Caddy volumes, OS and images</tspan></text>
<text x="190" y="1086" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="190" dy="0">Identity publishes JWKS privately to Auth and API (connections omitted).</tspan></text>
<rect x="1300" y="430" width="310" height="310" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="1322" y="465" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="1322" dy="0">External services</tspan></text>
<text x="1322" y="495" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1322" dy="0">Outbound HTTPS:</tspan><tspan x="1322" dy="25">LaLiga login + Fantasy API</tspan><tspan x="1322" dy="25">FutbolFantasy / standings</tspan><tspan x="1322" dy="25">Optional OpenWeather</tspan><tspan x="1322" dy="25"></tspan><tspan x="1322" dy="25">Resend SMTP · TLS 465</tspan><tspan x="1322" dy="25">Optional social providers</tspan></text>
<path d="M1260 600 H1300" fill="none" stroke="#64748b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/>
<text x="1435" y="775" font-size="15" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1435" dy="0">Services connect outbound;</tspan></text>
<text x="1435" y="798" font-size="15" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1435" dy="0">no public database ports.</tspan></text>
<rect x="1300" y="860" width="310" height="170" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.6"/>
<text x="1322" y="895" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="1322" dy="0">Cloud Storage</tspan></text>
<text x="1322" y="925" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1322" dy="0">Private backup bucket</tspan><tspan x="1322" dy="25">Daily logical DB backups</tspan><tspan x="1322" dy="25">Bounded retention</tspan><tspan x="1322" dy="25">Vault secrets backed up apart</tspan></text>
<path d="M375 1020 V1034 H75 V1125 H1280 V945 H1300" fill="none" stroke="#64748b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="1110" y="1147" font-size="15" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1110" dy="0">daily DB backups</tspan></text>
<text x="50" y="1165" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="50" dy="0">Only ports 80/443 are public. Keep identity, auth, API, scraping, PostgreSQL and Redis private.</tspan></text>
<text x="50" y="1197" font-size="15" fill="#475569">Registry: delete untagged after 7 days; keep 3 recent per image. Tagged releases require manual retirement.</text>
<text x="50" y="1225" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="50" dy="0">US pricing baseline · validate 2 GiB with four-user load · one VM is one failure domain · 27 October 2026</tspan></text>
</g></svg>