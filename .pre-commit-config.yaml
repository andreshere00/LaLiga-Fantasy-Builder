# Pre-commit hooks for linting, formatting, OpenAPI, and coverage-gated tests.
# Install once with: uv run poe install  (or: uv run pre-commit install)
default_language_version:
  python: python3.14

repos:
  - repo: local
    hooks:
      - id: lint
        name: lint (ruff)
        entry: uv run ruff check --fix backend main.py
        language: system
        pass_filenames: false
        types: [python]

      - id: format
        name: format (black)
        entry: uv run poe format
        language: system
        pass_filenames: false
        types: [python]

      - id: lint-frontend
        name: lint frontend (eslint react-hooks)
        entry: bash -c 'cd frontend && bun run lint'
        language: system
        pass_filenames: false
        files: ^frontend/(src/.*\.(ts|tsx)|eslint\.config\.js|package\.json)$

      - id: generate-openapi
        name: generate OpenAPI documentation (api + auth + scraping)
        entry: bash scripts/check-openapi-alignment.sh
        language: system
        pass_filenames: false
        files: >-
          ^(backend/api/src/fantasy_api/(api/|schemas/|openapi\.py|main\.py|config\.py)
          |backend/api/openapi\.json
          |backend/api/pyproject\.toml
          |backend/auth/src/fantasy_auth/(api/|openapi\.py|main\.py|config\.py)
          |backend/auth/openapi\.json
          |backend/auth/pyproject\.toml
          |backend/scraping/src/fantasy_scraping/(scraper/routes\.py|openapi\.py|main\.py|models/)
          |backend/scraping/openapi\.json
          |backend/scraping/pyproject\.toml)$

      - id: test
        name: test (pytest, ≥90% coverage)
        entry: uv run poe test
        language: system
        pass_filenames: false
        types: [python]
